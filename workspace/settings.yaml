summary:
  total_settings: 56
  requirements_covered: 47
  by_method:
    terraform: 10
    policy_api_write: 4
    manual: 42
  by_check:
    policy_api_read: 26
    reports_api: 2
    admin_sdk: 11
    manual_evidence: 17
  sources:
    guide: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf
    policy_api: https://docs.cloud.google.com/identity/docs/concepts/supported-policy-api-settings
    provider: 'macadmins/googleworkspace 1.5.3 (resources: user, group, group_settings, group_member(s),
      org_unit, role, role_assignment, schema, domain, domain_alias, chrome_policy*, gmail_send_as_alias)'
  notes: guide_page is the page where the requirement section starts (body page numbers; the guide's table
    of contents is off by one or two for some). Values tagged OGRL come from ogrl/org/implementation narratives;
    the guide mostly names features, not values. Editions not verified per feature; D1 baseline is Enterprise
    Plus. Retrieved 2026-11-23.

settings:
- id: user-directory-accounts
  requirement_refs:
  - 3.1.1
  - 3.1.6
  - 3.5.1
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=14
  admin_console_path: Directory > Users > Add new user
  recommended_value: One named account per person in the right OU; separate non-privileged daily account
    for every admin (3.1.6, guide p26)
  method: terraform
  terraform_resource: googleworkspace_user
  policy_api_setting: null
  check: admin_sdk
  ou_scope: all
  edition_required: null
  notes: Directory API users.list is the check (suspended, isAdmin, orgUnitPath, lastLoginTime). Guide
    also lists GCDS and Directory Sync (LDAP); not used here (Google is the IdP, D2). Policy API has no
    user-lifecycle setting.
- id: org-units-cui
  requirement_refs:
  - 3.1.1
  - 3.4.6
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=14
  admin_console_path: Directory > Organizational units
  recommended_value: OU tree with a CUI OU and a non-CUI OU (SCOPE section 5); users placed by OU
  method: terraform
  terraform_resource: googleworkspace_org_unit
  policy_api_setting: null
  check: admin_sdk
  ou_scope: n/a
  edition_required: null
  notes: 'Guide does not name OUs; OGRL/SCOPE do. Every OU-scoped check below depends on this. Check:
    Directory API orgunits.list.'
- id: saml-app-aws-identity-center
  requirement_refs:
  - 3.1.1
  - 3.5.2
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=61
  admin_console_path: Apps > Web and mobile apps > Add app > Add custom SAML app (Google as IdP to AWS
    IAM Identity Center)
  recommended_value: SAML app on for the CUI and non-CUI OUs, signed assertions, ACS URL and entity ID
    from Identity Center
  method: manual
  terraform_resource: null
  policy_api_setting: null
  check: manual_evidence
  ou_scope: all
  edition_required: null
  notes: 'Neither provider fork nor any Google API creates a custom SAML app in IdP mode (SCOPE section
    5). Guide p61 SSO profiles are the opposite direction (Google as SP to a third-party IdP) and do not
    apply when Google is the IdP. Evidence: screenshots of app config and per-OU service state, plus the
    AWS Identity Center identity-source page.'
- id: api-controls-third-party-apps
  requirement_refs:
  - 3.1.1
  - 3.1.3
  - 3.1.20
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=37
  admin_console_path: Security > Access and data control > API controls > Settings > Unconfigured third-party
    apps
  recommended_value: 'Don''t allow users to access any third-party apps (guide offers only: basic Sign
    in with Google scopes, or none); allow-list reviewed apps explicitly'
  method: manual
  terraform_resource: null
  policy_api_setting: api_controls.unconfigured_third_party_apps
  check: policy_api_read
  ou_scope: all
  edition_required: null
  notes: 'Read-only in Policy API. Related readable: api_controls.internal_apps, api_controls.app_approval_requests,
    api_controls.custom_user_message, api_controls.google_services. Domain-wide delegation lives on the
    same page (see reports-api-collection).'
- id: reseller-access-removal
  requirement_refs:
  - 3.1.1
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=17
  admin_console_path: Billing > Subscriptions (reseller access)
  recommended_value: No reseller admin access after onboarding (only if the tenant was resold)
  method: manual
  terraform_resource: null
  policy_api_setting: null
  check: manual_evidence
  ou_scope: n/a
  edition_required: null
  notes: Guide additional consideration 3, p17. One-time step; no API.
- id: device-inventory-endpoint-mgmt
  requirement_refs:
  - 3.1.1
  - 3.4.1
  - 3.5.1
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=16
  admin_console_path: Devices > Overview (Mobile devices, Endpoints, Company-owned)
  recommended_value: Endpoint Verification / advanced management on for the CUI OU; quarterly inventory
    export kept as evidence
  method: manual
  terraform_resource: null
  policy_api_setting: null
  check: admin_sdk
  ou_scope: cui
  edition_required: null
  notes: 'Enrolment is per-device and cannot be automated from here. Read: Directory API mobiledevices/chromeosdevices
    and Cloud Identity Devices API. Guide cites CIS Benchmarks for 3.4.1 (p49). Google does not inventory
    the company''s own hardware.'
- id: admin-roles-custom
  requirement_refs:
  - 3.1.2
  - 3.1.4
  - 3.1.5
  - 3.1.7
  - 3.4.5
  - 3.13.3
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=18
  admin_console_path: Account > Admin roles > Create new role
  recommended_value: Task-scoped custom roles (user admin, group admin, security reader, audit); no daily
    work from super admin
  method: terraform
  terraform_resource: googleworkspace_role (+ data.googleworkspace_privileges)
  policy_api_setting: null
  check: admin_sdk
  ou_scope: n/a
  edition_required: null
  notes: Directory API roles.list. Not a Policy API setting. Limit 750 custom roles (p19). 3.1.7 audit
    half is covered by the audit rows.
- id: admin-role-assignments
  requirement_refs:
  - 3.1.4
  - 3.1.5
  - 3.1.7
  - 3.4.5
  - 3.13.3
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=19
  admin_console_path: Account > Admin roles > (role) > Assign admins / Assign role to group
  recommended_value: Role assigned to groups where possible, minimal named list; CUSTOMER or ORG_UNIT
    scope per role
  method: terraform
  terraform_resource: googleworkspace_role_assignment
  policy_api_setting: null
  check: admin_sdk
  ou_scope: n/a
  edition_required: null
  notes: 'Directory API roleAssignments.list. Provider note: ORG_UNIT scope only works if all privileges
    are OU compatible. Guide p26 points to View role assignments and privileges for the review.'
- id: super-admin-minimum
  requirement_refs:
  - 3.1.5
  - 3.1.6
  - 3.4.5
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=25
  admin_console_path: 'Directory > Users (filter: Admin status); Account > Admin roles > Super Admin'
  recommended_value: Two to a few named super admins, security keys, each also holds a separate daily
    account
  method: manual
  terraform_resource: null
  policy_api_setting: null
  check: admin_sdk
  ou_scope: n/a
  edition_required: null
  notes: Count of isAdmin users via Directory API users.list. Terraform could set is_admin but that hides
    the privilege in code; keep manual. Multi-party approval needs 2+ super admins (p51).
- id: dlp-rules-cui
  requirement_refs:
  - 3.1.3
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=19
  admin_console_path: Security > Access and data control > Data protection > Manage rules (Drive, Chat,
    Gmail)
  recommended_value: Rules for CUI markings and detectors on the CUI OU; action block or warn on external
    share; optionally combine with Context-Aware Access
  method: policy_api_write
  terraform_resource: null
  policy_api_setting: rule.dlp
  check: policy_api_read
  ou_scope: cui
  edition_required: null
  notes: Policy API can write rule.dlp and detector.regular_expression / detector.word_list / detector.url_list.
    DLP for Gmail is beta in the guide (p19-21). Edition not stated in the guide; verify per feature.
- id: chrome-dlp
  requirement_refs:
  - 3.1.3
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=20
  admin_console_path: Devices > Chrome > Settings > Users and browsers (data controls)
  recommended_value: Optional. Chrome data controls for managed browsers on the CUI OU
  method: terraform
  terraform_resource: googleworkspace_chrome_policy
  policy_api_setting: null
  check: manual_evidence
  ou_scope: cui
  edition_required: null
  notes: Guide lists Chrome DLP for 3.1.3 but OGRL does not rely on it (Chrome telemetry out of scope,
    ogrl-lm-06). Chrome policy API is not the Policy API.
- id: drive-external-sharing
  requirement_refs:
  - 3.1.3
  - 3.1.22
  guide_page: null
  admin_console_path: Apps > Google Workspace > Drive and Docs > Sharing settings > Sharing options
  recommended_value: External sharing off or allow-listed for the CUI OU; anyone-with-link off
  method: manual
  terraform_resource: null
  policy_api_setting: drive_and_docs.external_sharing
  check: policy_api_read
  ou_scope: cui
  edition_required: null
  notes: Guide does not name this setting; OGRL ogrl-ac-03, -12, -18, -19 do. Read-only in Policy API.
- id: drive-general-access-default
  requirement_refs:
  - 3.1.3
  - 3.1.22
  guide_page: null
  admin_console_path: Apps > Google Workspace > Drive and Docs > Sharing settings > General access default
  recommended_value: Restricted (not Anyone with the link)
  method: policy_api_write
  terraform_resource: null
  policy_api_setting: drive_and_docs.general_access_default
  check: policy_api_read
  ou_scope: cui
  edition_required: null
  notes: 'Writable via Policy API (Mutate: Yes). Not named by the guide; from OGRL ogrl-ac-19.'
- id: failed-login-activity-rule
  requirement_refs:
  - 3.1.8
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=27
  admin_console_path: Rules > Create rule > Activity (data source User log events, event Failed login)
  recommended_value: Failed login count > 5 per 24 hours, action Suspend user, alert High, notify super
    admins (guide example values, p28)
  method: manual
  terraform_resource: null
  policy_api_setting: null
  check: manual_evidence
  ou_scope: all
  edition_required: null
  notes: Custom activity rules are not exposed in the Policy API (only rule.system_defined_alerts, read-only).
    Fired alerts are visible through the Alert Center API and Reports API login events. Guide p28 does
    give a concrete lockout rule.
- id: web-session-duration
  requirement_refs:
  - 3.1.11
  - 3.13.9
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=29
  admin_console_path: Security > Access and data control > Google session control > Web session duration
  recommended_value: 12 hours or less for CUI OU (OGRL baseline); guide gives no value, default 14 days
    (p79)
  method: manual
  terraform_resource: null
  policy_api_setting: security.session_controls
  check: policy_api_read
  ou_scope: cui
  edition_required: null
  notes: Read-only in Policy API; field webSessionDuration in seconds (43200). Admin console session is
    fixed at 1 hour; native mobile apps and OAuth apps ignore it (p30). Multi-party approval applies to
    this setting.
- id: reports-api-collection
  requirement_refs:
  - 3.1.12
  - 3.3.1
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=30
  admin_console_path: GCP console > APIs > enable Admin SDK API; Security > Access and data control >
    API controls > Domain-wide delegation
  recommended_value: Admin SDK API on, service account with domain-wide delegation limited to admin.reports.audit.readonly
    and admin.reports.usage.readonly; collector pulls every activity application
  method: manual
  terraform_resource: null
  policy_api_setting: null
  check: reports_api
  ou_scope: n/a
  edition_required: null
  notes: 'The google_project_service resource in hashicorp/google could enable the API (not the macadmins
    provider); delegation is console only. Guide p41: pull data into a central repository if retention
    needs exceed Workspace limits.'
- id: admin-sdk-api-access
  requirement_refs:
  - 3.1.15
  guide_page: https://services.google.com/fh/files/misc/google_workspace_cmmc_implementation_guide_2025.pdf#page=32
  admin_console_path: Account > Admin roles (API privileges follow the console privileges); GCP console
    enable Admin SDK
  recommended_value: Remote API privileges exist only through admin roles; no extra API roles
  method: terraform
  terraform_resource: googleworkspace_role
  policy_api_setting: null
  check: admin_sdk
  ou_scope: n/a
  edition_required: null
  notes: 'Guide p33: console privileges grant the matching Admin API privileges, so this is admin-roles-custom
    restated. Service account list from the DWD page is manual evidence.'
