narrative: >-
  IAM supports MFA with FIDO2 security keys and authenticator apps
  for the root user and IAM users, and AWS Config rules report MFA
  state (iam-user-mfa-enabled, root-account-hardware-mfa-enabled).
  When an external IdP signs users in to IAM Identity Center, MFA
  happens at the IdP.
