# Wizard parameters for the enclave OGRL bundle (ogrl/org).
#
# Not an OGRL object: it sits beside ogrl/org, not inside it, so bundle
# readers never scan it.
#
# Mechanism: RFC 0001 gives system, program, party, and component objects no
# parameter field (parameters exist only on controls and baselines). The
# bundle therefore carries the RFC's placeholder syntax, `{{ name }}` (RFC 0001
# section 7.3: no expressions or formatting inside the braces), in string
# fields. The wizard renders the bundle by replacing every `{{ name }}` with the
# value below in every file under org/ (no per-file target list to maintain),
# and in the policy and procedure documents under ogrl/policy/ and ogrl/procedure/,
# then recomputes resource.digest (sha-256) on every org/policy and org/procedure
# object so it pins the rendered document, and writes the result to the Fathom
# load path. The wizard must fail if any `{{ ... }}` remains after rendering. Unrendered placeholders are valid OGRL strings, so the
# template lints clean as committed.
#
# Enum fields (the CUI impact levels) can't hold a placeholder and still lint,
# so those parameters use `set_value`: the wizard writes the chosen value at
# each JSON pointer. The committed bundle carries the defaults.
#
# Control parameters (for example control--ogrl-ps-01 access_removal_sla) are a
# separate mechanism: baseline.parameter_bindings or
# implementation.parameter_values. None are set here; issues #9 to #16 add them.

parameters:
  company_name:
    label: Company legal name
    type: string
    required: true
    example: Acme Defense LLC
  domain:
    label: Primary Google Workspace domain
    type: string
    required: true
    example: acme-defense.com
  tier:
    label: Impact tier
    type: enum
    values: [standard, itar]
    default: standard
    required: true
    post_render:
      standard: >-
        Delete the second `subservice` entry in
        org/system/enclave.yaml#/parties (AWS GovCloud, identifier
        F1603047866).
      itar: >-
        Keep the AWS GovCloud entry. Keep or delete the commercial entry
        (identifier AGENCYAMAZONEW) to match whether the grc account
        (commercial, D7) counts as in the system boundary; the current
        decision keeps both.
  user_count:
    label: Number of enclave users
    type: integer
    required: true
    example: 25
  cui_categories:
    label: CUI categories handled (comma separated CUI Registry category names)
    type: string
    required: true
    example: CTI, Export Controlled
  sites:
    label: Offices and alternate work sites (comma separated; "remote only" if none)
    type: string
    required: true
    example: Huntsville AL office, remote
  ssp_signer_name:
    label: SSP signer, full name
    type: string
    required: true
    example: Jane Doe
  ssp_signer_title:
    label: SSP signer, title
    type: string
    required: true
    example: Chief Information Security Officer

  cui_confidentiality:
    label: CUI confidentiality impact (FIPS 199)
    type: enum
    values: [moderate, high]
    default: moderate
    required: true
    help: 32 CFR 2002 requires CUI to be protected at no less than moderate confidentiality.
    set_value:
      - org/system/enclave.yaml#/information_types/0/confidentiality
  cui_integrity:
    label: CUI integrity impact (FIPS 199)
    type: enum
    values: [low, moderate, high]
    default: moderate
    required: true
    help: Not set by CUI rules. Rate how much harm unauthorized changes to this CUI would cause.
    set_value:
      - org/system/enclave.yaml#/information_types/0/integrity
  cui_availability:
    label: CUI availability impact (FIPS 199)
    type: enum
    values: [low, moderate, high]
    default: low
    required: true
    help: Not set by CUI rules. Rate how much harm losing access to this CUI would cause.
    set_value:
      - org/system/enclave.yaml#/information_types/0/availability

# Facts the bundle carries that are not wizard inputs:
fixed:
  fedramp_authorizations:
    note: >-
      Source: FedRAMP Marketplace data set (GSA/marketplace-fedramp-gov-data,
      last_change 2026-05-19). FedRAMP authorizations do not expire, but
      RFC 0001 section 7.20 requires `authorization.expires`, so the bundle
      sets it to a review-by date (2027-11-23), not a FedRAMP expiry.
      Tracked in adversitydotdev/ogrl-rfcs#5.
      Re-verify at each SSP issue.
    entries:
      - {party: aws, identifier: AGENCYAMAZONEW, product: AWS US East/West, level: Moderate, authorized: 2013-05-01}
      - {party: aws, identifier: F1603047866, product: AWS GovCloud, level: High, authorized: 2016-06-21}
      - {party: google, identifier: F1206081364, product: Google Workspace, level: High, authorized: 2021-10-28}
