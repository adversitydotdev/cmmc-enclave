narrative: >-
  Duties are split in the account design: log archive and security
  tooling accounts are separate from the enclave workload account,
  so workload admins cannot change the org CloudTrail bucket, which
  has Object Lock. Permission sets separate admin, auditor, and
  Fathom operator. Terraform changes need a reviewer other than the
  author. SCPs stop member accounts from disabling CloudTrail,
  Config, and GuardDuty. Tested by Config rules
  iam-group-has-users-check, iam-user-group-membership-check,
  iam-policy-no-statements-with-admin-access.
