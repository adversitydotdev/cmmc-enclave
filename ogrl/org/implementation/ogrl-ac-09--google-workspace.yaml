narrative: >-
  Workspace has no native setting that suspends accounts after 90
  days of inactivity. Conservative plan: a scheduled check reads
  last login time from the Reports API and flags users idle beyond
  90 days for suspension within 24 hours; suspended users are
  deprovisioned in Identity Center by SCIM. Not yet built, so
  planned. Tested by that same scheduled report in Fathom.
