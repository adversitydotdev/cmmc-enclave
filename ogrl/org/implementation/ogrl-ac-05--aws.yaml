narrative: >-
  Console and CLI access goes through IAM Identity Center with
  Workspace as SAML IdP, so MFA is the Workspace security-key check
  above and permission sets expire after 1 hour. The only local AWS
  identities are the break-glass IAM user (two FIDO keys, no access
  keys, alert on use) and the sealed root user with hardware MFA;
  Terraform sets both. Tested by Config rules iam-user-mfa-enabled,
  mfa-enabled-for-iam-console-access, root-account-mfa-enabled, and
  root-account-hardware-mfa-enabled.
