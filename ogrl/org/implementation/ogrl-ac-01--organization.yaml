narrative: >-
  {{ company_name }} approves every user and service account request
  through the system owner or manager before provisioning, and ties
  HR termination and role-change events to Workspace suspension
  within the deprovision SLA (24 hours by baseline parameter). Also
  owns the 3.9.2 actions beyond account disable: retrieval of keys,
  tokens, and CUI from departing personnel, and transfer
  protections. Policy template comes with #20. Tested by
  test--ogrl-ac-01-lifecycle with approval tickets and termination
  records as manual evidence.
