narrative: >
  Workspace provides the inventory of users, groups, OUs, enrolled
  mobile and desktop devices, and installed Marketplace apps in the
  Admin console and Directory API. Terraform-managed pieces appear
  in state. Test: manual quarterly export of the Admin console
  device list and the installed apps list, kept as evidence. Google
  does not inventory the company's own hardware or software.
