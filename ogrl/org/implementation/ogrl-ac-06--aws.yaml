narrative: >-
  The only static AWS credential is the Identity Center SCIM access
  token, valid one year by design and rotated before expiry; Fathom
  tests token age and alerts inside the 90 day window (the library
  default rotation_period of 90 days is shorter than the one-year
  token life, see report). Break-glass has a console password and
  FIDO keys but no access keys; Config rule access-keys-rotated (90
  days) proves none exist. Any initial IAM password is created with
  password reset required.
