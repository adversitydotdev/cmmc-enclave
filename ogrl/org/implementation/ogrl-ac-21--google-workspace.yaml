narrative: >
  Workspace separates user functionality from the Admin console
  through admin roles. Our runbook assigns least-privilege prebuilt
  or custom roles to a small set of dedicated admin accounts
  (security key 2SV), and admins use separate accounts from daily
  mailboxes. Google is responsible for the service. Tested by a
  Directory API role assignment read (roles are not in the Policy
  API) and manual evidence of the admin list.
