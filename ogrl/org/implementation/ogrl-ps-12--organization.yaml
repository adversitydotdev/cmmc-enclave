narrative: >-
  Home offices and other alternate sites are approved in writing,
  users acknowledge written safeguards (managed encrypted device,
  approved remote access only, locked storage, screen privacy, no
  unapproved printing), and compliance is assessed annually by
  self-attestation. Google excludes 3.10.6 from Workspace (guide)
  and AWS lists it as inheritable, but the sites are the customer's.
  Test: manual evidence, acknowledgments and annual attestations.
