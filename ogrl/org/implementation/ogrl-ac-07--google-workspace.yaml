narrative: >-
  Super admin accounts are separate from daily accounts, kept to a
  short named list, with security keys required for admins. Custom
  admin roles carry delegated administration. Admin audit log
  records privileged actions (3.1.7) and Alert Center rules flag
  super admin role grants. Tested by exporting admin role
  assignments and the admin audit log through the Reports API; no
  Policy API read exists for role assignment.
