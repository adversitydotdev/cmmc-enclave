narrative: >-
  {{ company_name }} offices and home networks are untrusted
  wireless. Enclave access happens only through the authenticated,
  TLS-protected Workspace and Identity Center path (see ogrl-ac-11).
  Where an office network exists, the company inventories and
  authorizes access points, requires WPA2 or WPA3 Enterprise with
  AES encryption (3.1.17), and keeps guest wireless apart. The
  scoping decision goes into the SSP. Policy template comes with
  #20.
