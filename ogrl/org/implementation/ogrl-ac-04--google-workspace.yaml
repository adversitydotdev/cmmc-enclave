narrative: >
  Google carries boundary protection, public/internal subnetwork
  separation, and deny-by-default traffic for the Workspace service.
  The Google guide marks 3.13.5 and 3.13.6 as Google native and
  3.13.1 as shared, where our share is Gmail transport (secure
  transport TLS compliance rules, MTA-STS, a runbook step) and
  optional context-aware access for the CUI OU. Test: Cloud Identity
  Policy API read of the Gmail TLS compliance and MTA-STS settings,
  plus manual evidence of Google FedRAMP High authorization.
