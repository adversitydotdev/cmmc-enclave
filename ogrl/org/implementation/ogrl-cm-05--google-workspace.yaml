narrative: >
  Super admin and delegated admin roles limit who can change
  Workspace security settings. Super admins are few, use security
  keys, and are listed in the runbook. Terraform-managed settings
  change only through the pipeline. Test: manual quarterly export of
  admin role assignments from the Admin console; Admin audit log
  review.
