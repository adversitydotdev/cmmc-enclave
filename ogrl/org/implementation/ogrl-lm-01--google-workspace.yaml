narrative: >
  Google generates and structures Workspace audit records (Admin,
  Login, Drive, Token, and the other Reports API applications, each
  carrying the actor email) and fixes their content, so 3.3.2 is
  Google's. {{ company_name }} specifies the event types and
  retention: the Reports API collector (issue #30) pulls every
  activity application into the log archive account on a 5 minute
  schedule, where it is held 365 days under Object Lock, longer than
  Workspace's own per-event retention. Admin console Audit and
  investigation covers ad hoc review (3.3.3). Test: the collector's
  last-success timestamp and a sample archived record, plus a Cloud
  Identity Policy API read of audit-related settings; manual
  evidence until the collector exists. Chrome and device log events
  are outside the CUI data path and not collected.
