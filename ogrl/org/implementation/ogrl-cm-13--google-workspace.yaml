narrative: >-
  Workspace enforces 2-Step Verification with security keys only for
  every user, which authenticates every Identity Center
  administrative session. Set by runbook; test: Cloud Identity
  Policy API read of the 2SV enforcement and allowed-methods
  settings. Google administers its own service maintenance sessions
  under its FedRAMP boundary (Workspace guide, MA.L2-3.7.5).
