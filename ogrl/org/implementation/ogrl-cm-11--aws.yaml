narrative: >
  AWS sanitizes or destroys storage media before equipment leaves
  its data centers for repair or return, using NIST SP 800-88
  techniques per its public data center controls. Customer data is
  also protected by KMS CMK encryption in Terraform, so media
  removed by AWS holds only ciphertext. Test: manual evidence,
  annual review of the AWS FedRAMP authorization listing (Moderate
  for US East/West, High for GovCloud) and the public AWS data
  center controls page.
