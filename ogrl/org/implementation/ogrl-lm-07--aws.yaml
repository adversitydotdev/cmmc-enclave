narrative: >
  AWS services stamp CloudTrail, Config, and flow log records in UTC
  from their own clocks; AWS keeps them synchronized to its time
  infrastructure (Amazon Time Sync Service, UTC-traceable). Enclave
  compute uses the link-local Amazon Time Sync address through
  chrony, the AMI default, and our Terraform must not point
  instances at other NTP servers. Test: manual evidence (chronyc
  tracking on a sample instance; CloudTrail eventTime in ISO 8601
  UTC). The conformance pack has no Config rule for this
  requirement. The SSP records reliance on the AWS time service.
  Public docs describe the EC2 time service only; how AWS
  disciplines the clocks of managed service log writers is not
  described in the sources we use.
