narrative: >-
  Paper and removable media with CUI carry the banner marking,
  category indicator, and distribution statement required by 32 CFR
  2002 and DoDI 5200.48, and marking is sampled annually. Marking is
  a customer duty on every real enclave, so it is customer even
  though AWS lists 3.8.4 as inheritable and Google excludes it
  (SCOPE section 9). Test: manual evidence, annual marking sample.
