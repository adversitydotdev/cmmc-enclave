narrative: >
  Workspace provides the security investigation tool (search and
  filter across audit data sources, saved as reports), reporting and
  activity rules, and the alert center for on-demand reduction and
  reporting (3.3.6) and rule based response (3.3.5). Baseline:
  investigation tool roles limited to the security team; rules for
  suspicious sign in, admin setting change, and external sharing
  alert the security on-call team. Customer configured per the
  guide, not Google native. Test: manual evidence (exported rule
  list, a saved investigation query run during the annual capability
  test). Cross-source correlation with AWS is in the AWS row.
