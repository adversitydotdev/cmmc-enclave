narrative: >-
  Acceptable use and rules-of-behavior policy covering CUI handling,
  approved SaaS, and incident reporting. Each person acknowledges it
  before Workspace and Identity Center accounts are provisioned, and
  again annually. Google Workspace has no native feature for this
  (guide: outside Workspace). Test: manual evidence, the policy,
  review history, and acknowledgment dates compared with account
  creation dates. Policy template arrives with issue #20.
