narrative: >-
  Workspace is the identity provider. CUI users sit in a dedicated
  organizational unit. Admins create accounts on an approved request
  and suspend them on termination or role change, which blocks SSO
  to AWS at once. Third-party OAuth apps are blocked unless approved
  (api_controls.unconfigured_third_party_apps), limiting access by
  processes acting for users. Workspace user lifecycle state is not
  readable through the Policy API, so evidence is the Reports API
  admin audit log (user suspend events) matched to HR termination
  records. Closes the 3.9.2 account-action half only; return of
  credentials and CUI is Organization. The CUI and non-CUI
  organizational units are the googleworkspace_org_unit resources in
  the Terraform module terraform/modules/workspace, and accounts
  created through its googleworkspace_user resource land in the
  right unit.
