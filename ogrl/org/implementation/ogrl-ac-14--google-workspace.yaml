narrative: >-
  Users: password management enforces minimum length 12, Enforce
  strong password (Google screens for common and compromised
  values), and enforcement at next sign-in; passwords are sent over
  TLS. Lockout (3.1.8): an activity rule fires on more than 5 failed
  logins in 24 hours and its action suspends the user (guide
  p27-28). Unchecking Allow password reuse addresses reuse (guide
  p66). With the lockout rule in place the Workspace part of 3.1.8
  is fully implemented. Remaining gap: Google exposes no password
  history count setting, so 24 generations (3.5.8) cannot be set;
  only Allow reuse on/off, set off. Security keys are the real
  second factor, which limits the risk of the gap. Tested by Policy
  API read of password length, strength, and allowReuse (activity
  rules are not in the Policy API, so the lockout rule is manual
  evidence plus Alert Center and Reports API login events); the
  history gap stays open until compensating evidence is accepted or
  a POA&M item is raised.
