narrative: >-
  Users: password management enforces minimum length 12, Enforce
  strong password (Google screens for common and compromised
  values), and enforcement at next sign-in; passwords are sent over
  TLS. Gaps that Google does not expose: password history for reuse
  (3.5.8, 24 generations cannot be set; only Allow reuse on/off, set
  off), a changed-characters rule (3.5.7(c)), and an admin-set
  lockout count (3.1.8; Google applies its own login challenges).
  Security keys are the real second factor, which limits the risk of
  the gaps. Tested by Policy API read of password length and
  strength settings; the gaps stay open until compensating evidence
  is accepted or a POA&M item is raised.
