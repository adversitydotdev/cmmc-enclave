narrative: >-
  Workspace is the IdP for IAM Identity Center over SAML, so a
  suspended user gets no new sessions, and permission set sessions
  last 1 hour at most. SCIM auto-provisioning is set to suspend
  deprovisioned users within 24 hours (the shortest option; others
  run to 30 days). The break-glass IAM user and its FIDO keys are
  removed by hand if the leaver held them. Test: manual evidence,
  Identity Center user status after offboarding and break-glass key
  inventory.
