narrative: >-
  {{ company_name }} specifies the authoritative time sources in the
  SSP (3.3.7 b): the Amazon Time Sync Service for AWS compute,
  Google's time service for Workspace, and OS network time for
  endpoints. Audit records use UTC timestamps from the systems' own
  clocks (3.3.7 a). Instances must not be pointed at other NTP
  servers, and the baseline checks synchronization (3.3.7 c).
  Evidence is the SSP statement and a sample time-sync output.
  Written into the Audit and Accountability Policy.
