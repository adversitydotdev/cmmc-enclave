narrative: >-
  Workspace gates the SAML app and CUI services with context-aware
  access that requires an enrolled, compliant device (Endpoint
  Verification, advanced mobile management for phones, with device
  encryption and screen lock required). Enrolled devices are listed
  in the Admin console. Context-aware access and mobile settings
  have no Policy API read; evidence is access level screenshots and
  the device inventory export. Google management only works if the
  company enrolls its devices. Mobile and desktop connections
  (3.1.18 c) are logged: Login audit events record device and
  sign-in details, and the Reports API collector archives them to
  the AWS log archive for the weekly review.
