narrative: >-
  {{ company_name }} keeps the inventory of collaboration devices
  (conference rooms, cameras, microphones, Meet hardware), prohibits
  remote activation, and prohibits administrators from remotely
  joining Meet hardware to calls, because Workspace has no setting
  that blocks it (3.13.12, Google guide p.79). Devices show an
  in-use indicator to people in the room. Meet hardware stays off
  unless needed, and settings are reviewed quarterly. Evidence is
  the device inventory and quarterly review record. Written into the
  Access Control and System and Communications Protection policies.
