narrative: >
  Subservice for Google Meet only. Meet media and signaling are
  encrypted in transit by default, Meet audit logs and usage reports
  are in Admin console and the Reports API (pulled into the log
  archive), and our runbook restricts external participants on the
  CUI OU. Google Voice is not used unless added later. AWS lists
  this customer only; Google lists it native (SCOPE section 9, item
  3). Test: manual evidence (Meet settings screenshots; the audit
  found no Meet setting in the Policy API) and Reports API Meet
  logs.
