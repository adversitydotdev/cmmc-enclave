narrative: >-
  On termination or transfer an admin suspends the user in Workspace
  (User Directory), which blocks SSO to every app including AWS,
  then deletes after data handover. The runbook sets the offboarding
  step; Google provides the suspend and delete functions. Test:
  Cloud Identity Policy API and Admin console read of suspended
  users; manual evidence, the offboarding ticket with suspend
  timestamp.
