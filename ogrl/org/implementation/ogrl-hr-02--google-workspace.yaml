narrative: >-
  On termination or transfer an admin suspends the user in Workspace
  (User Directory), which blocks SSO to every app including AWS,
  then deletes after data handover. The runbook sets the offboarding
  step; Google provides the suspend and delete functions. Test:
  Directory API read of the suspended flag (user lifecycle is not in
  the Policy API) and Reports API suspend events; manual evidence,
  the offboarding ticket with suspend timestamp. Accounts managed by
  the googleworkspace_user resource in the Terraform module
  terraform/modules/workspace are suspended by setting its suspended
  attribute.
