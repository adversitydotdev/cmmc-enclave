narrative: >
  Terraform sets: CloudTrail delivery to CloudWatch Logs with metric
  filters and alarms, and EventBridge rules for StopLogging,
  DeleteTrail, UpdateTrail, PutEventSelectors, and Object Lock or
  bucket policy changes on the log bucket, all notifying an SNS
  topic to the security on-call team and the logging platform owner,
  target under 1 hour. Also alarms on the Workspace collector Lambda
  (errors, no successful run in 15 minutes) and a no-new-objects
  alarm on the log bucket. GuardDuty and Security Hub are on in
  every account. Tests: Config rules cloud-trail-cloud-watch-
  logs-enabled, cloudwatch-alarm-action-check, guardduty-enabled-
  centralized, securityhub-enabled, plus a periodic test alert whose
  ticket is the evidence. AWS does not alert customers on their own
  trail failures, so this is ours. The collector alarms arrive with
  issue #30.
