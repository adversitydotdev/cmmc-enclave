narrative: >
  Terraform sets: CloudTrail delivery to CloudWatch Logs with metric
  filters and alarms, and EventBridge rules for StopLogging,
  DeleteTrail, UpdateTrail, PutEventSelectors, and Object Lock or
  bucket policy changes on the log bucket, all notifying an SNS
  topic to the security on-call team and the logging platform owner,
  target under 1 hour. The Workspace collector Lambda (module
  workspace_audit, log archive account) has three CloudWatch alarms
  to the same findings topic: Lambda Errors at or above 1; no
  successful run in 15 minutes (the collector's Success metric,
  missing data counts as breaching); and no new objects under
  workspace-audit/ for 6 hours (the collector's ObjectsWritten
  metric, tunable for quiet tenants). GuardDuty and Security Hub are
  on in every account. Tests: Config rules
  cloud-trail-cloud-watch-logs-enabled,
  cloudwatch-alarm-action-check, guardduty-enabled-centralized,
  securityhub-enabled, plus a periodic test alert whose ticket is
  the evidence. AWS does not alert customers on their own trail
  failures, so this is ours.
