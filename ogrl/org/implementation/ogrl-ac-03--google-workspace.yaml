narrative: >-
  Admin console access uses custom admin roles scoped to the task
  (user management, security reader, audit) instead of super admin.
  User functions are limited per organizational unit by turning
  services on or off, restricting external sharing and third-party
  app access, so CUI users only run approved FedRAMP High services.
  Tested by reading drive_and_docs.external_sharing and
  api_controls.* and service_status per OU through the Policy API
  and by exporting the admin role assignment list as manual
  evidence. The per-OU service on/off state is read through the
  Policy API service_status setting (a boolean per OU or group). The
  task-scoped custom admin roles are googleworkspace_role resources
  in the Terraform module terraform/modules/workspace (user admin
  and help desk, with an audit viewer role once its privilege name
  is set), assigned by googleworkspace_role_assignment from a
  variable map.
