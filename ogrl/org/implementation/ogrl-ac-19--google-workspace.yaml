narrative: >-
  For the CUI OU, public and anyone-with-the-link sharing is off or
  limited to an allowlist, and publishing services such as Google
  Sites are off for the CUI OU, with publishing rights held by a
  short admin role roster. Tested by reading
  drive_and_docs.external_sharing and
  drive_and_docs.general_access_default through the Policy API;
  per-OU service state is manual evidence.
