narrative: >-
  Replay resistance (3.5.4): sign-in uses security keys
  (FIDO2/WebAuthn, challenge-response) and TLS-protected SAML with
  signed, time-bound assertions to AWS. Obscured feedback (3.5.11):
  Google and AWS sign-in forms mask passwords. Legacy protocols that
  send reusable secrets are not used; the 2SV Only security key
  setting means password-only IMAP/POP style access cannot
  authenticate. Tested by Policy API read of the 2SV methods
  setting; masking is manual screenshot evidence.
