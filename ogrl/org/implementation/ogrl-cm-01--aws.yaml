narrative: >
  The Terraform repository, version controlled with required pull
  request review, is the change record for AWS. Branch protection
  requires an independent approver and passing plan checks, and the
  apply runs from the pipeline role against a merged commit.
  CloudTrail (organization trail to an Object Lock bucket) logs
  every API change and AWS Config records each resource
  configuration change, so approved changes and actual changes can
  be compared. Tests: Config rules CLOUD_TRAIL_ENABLED and
  MULTI_REGION_CLOUD_TRAIL_ENABLED; library test
  test--ogrl-cm-01-change-control (branch protection) once the
  repository is attached; manual PR sample.
