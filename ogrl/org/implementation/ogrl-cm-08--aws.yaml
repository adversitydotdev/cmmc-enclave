narrative: >
  Least functionality on AWS is set in Terraform: default-deny
  security groups, no inbound internet except the Fathom ALB, no
  unrestricted route to an internet gateway for other subnets, VPC
  endpoints for needed services, and SCPs denying unused services
  and Regions. No general-purpose software installs on workload
  hosts; images are built from code. Tests: Config rules
  RESTRICTED_INCOMING_TRAFFIC, INCOMING_SSH_DISABLED,
  VPC_DEFAULT_SECURITY_GROUP_CLOSED,
  VPC_SG_OPEN_ONLY_TO_AUTHORIZED_PORTS,
  NO_UNRESTRICTED_ROUTE_TO_IGW; manual quarterly review of the
  allowed ports and image package lists.
