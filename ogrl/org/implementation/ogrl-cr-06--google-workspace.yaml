narrative: >
  Google carries FIPS-validated cryptography for Workspace (Google
  guide: native), covered by its FedRAMP High authorization.
  Google's BoringCrypto module holds FIPS 140-3 CMVP certificate
  #4735 (Active); the earlier FIPS 140-2 certificate #4407 became
  Historical on 2026-09-21 and is not cited. We record the module
  and certificate in the crypto inventory and re-check its status on
  the CMVP site at each SSP review. Test: manual evidence (CMVP
  certificate page).
