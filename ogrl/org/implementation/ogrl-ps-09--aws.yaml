narrative: >-
  AWS physically controls and securely stores the media in its data
  centers and limits access to authorized staff (AWS lists 3.8.1 and
  3.8.2 as inheritable). Digital CUI on the media is also under KMS
  CMK encryption. This covers only cloud data-center media, not
  paper, USB drives, or laptops. Test: manual evidence, annual
  review of the AWS FedRAMP authorization listing (Moderate for US
  East/West, High for GovCloud) and the public AWS data center
  controls page; no Artifact or CRM material is used.
