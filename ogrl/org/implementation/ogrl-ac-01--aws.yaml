narrative: >-
  Identity Center users come only from Workspace SCIM sync; groups
  and memberships are Terraform (aws_identitystore_group*) changed
  by reviewed pull request, so each AWS account holder has an
  approved change record. Disabling or suspending the user in
  Workspace stops SAML sign-in and the next SCIM sync deactivates
  the Identity Center user; permission set sessions last 1 hour, so
  access ends within the deprovision SLA. The break-glass IAM user
  is the only non-federated human identity, kept on the privileged
  roster. Tested by Config rules iam-user-unused-credentials-check
  and iam-user-group-membership-check, plus the library test
  test--ogrl-ac-01-lifecycle.
