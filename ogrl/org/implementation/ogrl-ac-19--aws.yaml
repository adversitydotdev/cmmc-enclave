narrative: >-
  Nothing in the enclave account is public: S3 public access is
  blocked at account level and per bucket, and the only internet-
  facing endpoint is the authenticated Fathom ALB. Tested by Config
  rules s3-account-level-public-access-blocks-periodic, s3-bucket-
  public-read-prohibited, s3-bucket-public-write-prohibited, rds-
  snapshots-public-prohibited, ebs-snapshot-public-restorable-check.
