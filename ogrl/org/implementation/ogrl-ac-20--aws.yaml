narrative: >-
  Identity Center sign-in is SAML via Workspace with TLS 1.2+ and 1
  hour sessions, so assertions cannot be replayed beyond their
  validity. Break-glass console login uses FIDO2 plus password over
  TLS; the AWS sign-in page masks the password field (3.5.11).
  Tested by manual evidence (sign-in screenshot, IdP configuration
  export); no Config rule exists for this.
