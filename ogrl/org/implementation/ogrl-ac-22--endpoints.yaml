narrative: >
  Endpoints are outside this repo; the customer brings its own
  managed devices. Split tunneling is an endpoint and VPN control.
  The enclave has no VPN: CUI is reached only over TLS through
  Workspace and AWS (Identity Center). The customer must document in
  the SSP how remote devices are prevented from bridging networks,
  or run a full-tunnel or ZTNA client that the MDM profile locks.
  Sources disagree: Google lists it native, AWS lists it customer
  only (SCOPE section 9, item 3); we take customer. Evidence: client
  configuration profile and a test showing local networks are
  unreachable while connected.
