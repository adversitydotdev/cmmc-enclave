narrative: >
  Per the Google guide, Google carries protection of Workspace audit
  records and tooling from modification and deletion;
  {{ company_name }} limits access. Runbook baseline: Admin console
  audit data (Audit and investigation, Reports API) is limited to a
  custom admin role held by the security team, and the super admin
  count is kept minimal (3.3.9). The collected copy sits under
  Object Lock in AWS (see the AWS row), so a Workspace admin cannot
  alter the retained record. Test: manual evidence (admin role
  assignment export), because admin role privileges are not a
  supported Policy API setting we rely on.
