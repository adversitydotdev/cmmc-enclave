narrative: >-
  Workspace is browser access over Google-managed TLS; the Workspace
  guide marks 3.1.13 and 3.1.14 as native to Google. Context-aware
  access can require a managed device and a trusted network posture
  for CUI apps. Sign-in and admin actions are logged in the Reports
  API (Admin SDK) and reviewed in the security investigation tool
  and Alert Center (3.1.12). Google routes remote access through its
  own managed access control points (3.1.14). Context-aware access
  has no Policy API read; evidence is the access level and
  assignment screenshots.
