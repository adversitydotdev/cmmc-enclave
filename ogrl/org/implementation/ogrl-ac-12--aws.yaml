narrative: >-
  The enclave VPC has no internet gateway route to workload subnets
  except the Fathom ALB (WAF attached), public IPs are off by
  default, security groups default closed, S3 public access is
  blocked at account level, and VPC endpoints keep AWS API traffic
  private. SCPs deny actions that would open these paths. Isolation
  between AWS tenants and clearing of released memory and storage is
  AWS-operated (3.13.4). Tested by Config rules
  no-unrestricted-route-to-igw,
  internet-gateway-authorized-vpc-only, vpc-default-security-group-
  closed, restricted-ssh, restricted-common-ports,
  subnet-auto-assign- public-ip-disabled, ec2-instance-no-public-ip,
  s3-account-level- public-access-blocks-periodic, alb-waf-enabled.
