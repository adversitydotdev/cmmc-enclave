narrative: >
  The enclave has no general-purpose hosts: Fathom runs on Fargate
  and everything else is managed services, so there is no host agent
  to deploy. Terraform enables ECR scan on push for private
  repositories, and GuardDuty is on in every account for threat
  detection. GuardDuty malware protection and Inspector are not in
  the baseline, and GuardDuty foundational is detection, not file
  scanning. Tested by Config rules ecr-private-image-
  scanning-enabled and guardduty-enabled-centralized. If a customer
  adds EC2 or other general-purpose hosts, EDR on them is the
  customer's and the control reverts to planned. AWS patches and
  protects the Fargate platform; image contents are
  {{ company_name }}'s.
