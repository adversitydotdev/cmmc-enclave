narrative: >-
  Connections from outside systems are limited by design: no inbound
  internet except the Fathom ALB, VPC endpoints for AWS APIs, SCPs
  that deny use of unapproved regions and services, and S3 public
  access block. Use of external systems for AWS is limited to
  federated sign-in from the Workspace IdP. Tested by Config rules
  internet-gateway-authorized-vpc-only,
  no-unrestricted-route-to-igw, s3-bucket-public-read-prohibited,
  s3-account-level-public-access-blocks-periodic, restricted-ssh,
  restricted-common-ports.
