narrative: >-
  {{ company_name }} defines the session lock and termination
  conditions. Endpoints lock after 15 minutes of inactivity, require
  re-authentication, and show a pattern-hiding display (3.1.10 a to
  c). Remote and application sessions end on these conditions
  (3.1.11 a): 30 minutes of inactivity where the platform has an
  inactivity timer, 12 hours total, termination or role change, and
  loss of device compliance (3.13.9 a). Workspace web sessions and
  Identity Center have no inactivity timer, so session length plus
  the endpoint lock is the recorded control; AWS and Workspace do
  not display or lock anything on the user's screen. Evidence is the
  SSP section with the values and the MDM and settings exports.
  Written into the Access Control and System and Communications
  Protection policies.
