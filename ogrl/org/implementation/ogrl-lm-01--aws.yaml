narrative: >
  AWS generates the control-plane records (CloudTrail management
  events; the userIdentity block names the IAM Identity Center
  principal, which gives 3.3.2); {{ company_name }} chooses what is
  logged and keeps it. Terraform sets an organization CloudTrail
  (all accounts, all regions, management events plus S3 data events
  on the log archive and enclave buckets) delivering to an Object
  Lock bucket in the log archive account with a CMK, kept 365 days
  (S3 lifecycle; CloudWatch log groups at 365 days). Also on: VPC
  flow logs, ALB access logs, Config. Config rules from the CMMC 2.0
  L2 conformance pack test it: cloudtrail-enabled,
  multi-region-cloudtrail-enabled, cloudtrail-s3-dataevents-enabled,
  cloud-trail-cloud-watch-logs-enabled,
  cw-loggroup-retention-period-check (365), elb-logging-enabled,
  s3-bucket-logging-enabled. Library test test
  --ogrl-lm-01-audit-logging fits this row. Privileged function
  execution (3.1.7) is captured by CloudTrail management events for
  IAM, Organizations, and permission set changes. Review of event
  types (3.3.3) is the Organization row.
