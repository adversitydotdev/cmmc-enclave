narrative: >
  Runbook steps, not Terraform: turn off Google services the enclave
  does not need for the CUI OU; set Marketplace to allow only listed
  apps (allowlist) and block user installs of unlisted apps;
  restrict third-party API access to allowlisted OAuth apps. Test:
  Admin console service status and Marketplace setting export per OU
  (Policy API read where the setting is exposed; not yet confirmed);
  manual quarterly review of the allowlist.
