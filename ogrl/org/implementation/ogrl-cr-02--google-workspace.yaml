    url: "https://support.google.com/a/answer/10743588"
narrative: >
  Google establishes and manages the keys behind default Workspace
  encryption (Google guide: native). If CSE is enabled for the CUI
  OU (required for the ITAR tier), the keys move to the customer's
  external key service and the customer manages them, so the guide
  says this control then enters the CUI boundary. Sources agree; we
  record the CSE exception and put those keys in the Organization
  key inventory. Test: manual evidence of Google FedRAMP High; CSE
  settings are not in the Policy API, so if CSE is enabled the
  evidence is console screenshots.
