narrative: >-
  Admin roles are split so that the people who administer users do
  not also hold audit-log and security-reader duties, and the audit
  log is exported to the AWS log archive account where Workspace
  admins have no write access. Evidence is the admin role assignment
  export compared with the duty matrix.
