narrative: >-
  USB mass storage is blocked by default through MDM or EDR
  device-control policy, with allow-listed issued devices only.
  ChromeOS fleets can use the Chrome USB access policy from the
  Workspace guide. Endpoints are out of scope for this repository.
  Test: manual evidence, device-control policy export and a
  blocked-device test on a sample endpoint.
