narrative: >
  AWS sanitizes or destroys retired storage media per NIST SP 800-88
  before disposal or reuse. The customer side is cryptographic
  erase: all enclave data is under KMS CMKs set in Terraform, and
  key deletion makes the ciphertext unrecoverable. Test: manual
  evidence, annual review of the AWS FedRAMP authorization listing
  (Moderate for US East/West, High for GovCloud) and the public AWS
  data center controls page.
