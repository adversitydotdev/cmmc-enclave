narrative: >-
  CUI flow is limited in Workspace through external sharing off or
  allowlisted for the CUI OU, DLP rules for CUI markings, and
  approval-based third-party app access. Google separates tenant
  data in its multi-tenant service (3.13.4, native per Google).
  Tested by reading drive_and_docs.external_sharing, rule.dlp, and
  api_controls.* through the Policy API.
