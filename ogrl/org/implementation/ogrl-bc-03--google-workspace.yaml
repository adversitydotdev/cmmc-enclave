narrative: >-
  Google stores the redundant copies of Workspace data it keeps for
  durability, encrypted at rest by default, and the Workspace guide
  marks MP.L2-3.8.9 as Google's responsibility. Workspace has no
  customer-run backup of mailboxes or Drive; any customer export of
  CUI (Vault export, Takeout) is a backup copy covered by the
  Organization row. Test: manual evidence, annual review of the
  Google guide entry and FedRAMP High listing.
