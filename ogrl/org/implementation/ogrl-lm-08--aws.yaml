narrative: >
  The log archive account holds the org trail, Config, flow logs,
  ALB logs, and Workspace audit logs in one S3 layout, queryable
  with Athena (Glue tables, partition projection) so analysts can
  filter, search, and write reports on demand without touching the
  Object Lock originals (3.3.6). Correlation across sources comes
  from Security Hub and GuardDuty findings in security tooling, plus
  Athena saved queries joining CloudTrail and Workspace records on
  user email (3.3.5). Tests: Config rules
  guardduty-enabled-centralized and securityhub-enabled; an annual
  on-demand query across CloudTrail and Workspace records is the
  evidence. Planned: the Athena tables and saved queries are not yet
  in the M2 or M3 scope or the cost model (small, billed per query).
