narrative: >-
  Privileged work uses a dedicated admin permission set, separate
  from the auditor and daily roles, with 1 hour sessions, so
  privileged users do not use admin rights for routine work (3.1.6).
  Root is sealed with hardware MFA and no access keys; break-glass
  is an IAM user with two FIDO keys and no access keys, with an
  EventBridge alert on use. CloudTrail org trail records every
  privileged API call (3.1.7), and attempts blocked by SCPs appear
  as denied calls. Tested by Config rules
  root-account-hardware-mfa-enabled, iam-root-access- key-check,
  cloudtrail-enabled, multi-region-cloudtrail-enabled, iam-
  policy-no-statements-with-admin-access.
