narrative: >-
  Google Workspace is the identity provider for AWS and carries MFA
  for every user. 2-Step Verification is enforced on the CUI and
  non-CUI OUs with Methods set to Only security key (passkeys
  count), so every sign-in, local or network, privileged or not,
  needs a phishing-resistant factor. Identity Center MFA is not used
  because it does not apply to external IdPs. Set by runbook step in
  the Admin console (Security > Authentication > 2-step
  verification); tested by a Cloud Identity Policy API read of the
  2SV enforcement and allowed-methods settings, plus the Reports API
  2SV-enrolled and enforced user attributes for 100% of active
  users.
