narrative: >
  Drift is detected two ways. AWS Config evaluates the CMMC 2.0
  Level 2 conformance pack continuously and flags noncompliant
  resources, and a scheduled terraform plan in CI reports any
  difference between code and live state. Alerts go to Security Hub
  and the security team. Tests: Config conformance pack compliance
  state; scheduled plan job shows no unapproved diff (manual
  evidence of the last run).
