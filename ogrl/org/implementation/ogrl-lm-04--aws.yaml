narrative: >
  AWS provides the review data: the org CloudTrail in the Object
  Lock log archive, Security Hub and GuardDuty findings, and Config
  history for changes to security tooling. {{ company_name }} still
  has to define the saved weekly review queries (for example Athena
  or CloudWatch Logs Insights over privileged API calls, break-glass
  use, and disabled security services). Planned until those queries
  exist. Test: manual evidence, the weekly review ticket with query
  output attached. Covers the AWS side of 3.3.5 (correlate audit
  review) and 3.14.7.
