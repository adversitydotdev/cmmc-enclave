narrative: >-
  {{ company_name }} prohibits split tunneling and bridging of
  networks on remote devices that reach CUI (3.13.7). The enclave
  has no VPN: CUI is reached only over TLS through Workspace and
  Identity Center. If a VPN or ZTNA client is ever added, it must be
  full tunnel, or route all non-tunneled traffic through a managed
  cloud security gateway. The decision is recorded in the SSP.
  Evidence is the SSP statement and the endpoint client profile.
  Written into the System and Communications Protection Policy.
