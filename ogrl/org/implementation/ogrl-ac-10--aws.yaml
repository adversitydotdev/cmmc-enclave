narrative: >-
  Identity Center permission sets have 1 hour sessions, which ends
  console and CLI sessions well inside the 12 hour limit in the
  baseline. Session Manager sets an idle session timeout so shell
  sessions end after inactivity, and network connections end with
  them. The Fathom ALB idle timeout is set explicitly. No Config
  rule maps to 3.1.11 or 3.13.9, so evidence is the Terraform
  permission set and SSM preference values, read by the AWS
  integration.
