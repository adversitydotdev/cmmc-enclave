narrative: >
  Endpoints are outside this repo; the customer brings its own
  managed devices. Covers remote access encryption (3.1.13), CUI on
  mobile devices (3.1.19), and CUI at rest on laptops (3.13.16):
  full-disk encryption (FileVault, BitLocker) and mobile device
  encryption in FIPS-validated mode, enforced by MDM, with browser
  sessions over TLS 1.2 or higher. Evidence is the MDM compliance
  report.
