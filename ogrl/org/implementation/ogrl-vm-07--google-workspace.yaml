narrative: >
  Google guide rates this shared. Meet hardware, if used, shows
  in-use indicators, but an admin can remotely join a device to a
  meeting from the Admin console and no setting disables that, so
  the customer must prohibit it by policy and limit Meet hardware
  admin roles. Our runbook sets the Meet camera and microphone
  defaults and turns Meet hardware off unless needed. Test: manual
  evidence (admin role list, Meet settings screenshots); the
  remote-join gap has no setting to read.
