narrative: >
  Terraform enables GuardDuty (foundational data sources: CloudTrail
  management events, VPC flow logs, DNS logs) and Security Hub in
  every account, with the security tooling account as delegated
  administrator, so findings from all accounts land in one place.
  Org CloudTrail and VPC flow logs give the inbound and outbound
  traffic visibility for 3.14.6 and the unauthorized-use signal for
  3.14.7. GuardDuty and Security Hub findings route through
  EventBridge to notifications. SCPs block disabling GuardDuty.
  Tested by the Config rules guardduty-enabled-centralized,
  securityhub-enabled, cloudtrail-enabled, and
  multi-region-cloudtrail-enabled, plus the library test
  test--ogrl-lm-02-security-monitoring. AWS operates the detection
  service; {{ company_name }} configures it and triages the alerts.
  No Inspector, Macie, or GuardDuty S3 or runtime protection in the
  baseline. Boundary protection for 3.13.1 is mapped here for
  monitoring only; the boundary itself is carried by the SC
  controls.
