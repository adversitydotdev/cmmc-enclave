narrative: >
  AWS provides the controls; our Terraform sets them. The log
  archive account is separate from workloads. The CloudTrail bucket
  has Object Lock (compliance mode, 365 days), versioning, SSE-KMS
  with a CMK, TLS- only access, and no public access; an SCP denies
  StopLogging, DeleteTrail, UpdateTrail, and Object Lock or bucket
  policy changes to everyone including account admins. Log file
  validation is on. Read access (3.3.8) is limited to the auditor
  and security permission sets. Management of logging (3.3.9) is
  limited to a named logging admin permission set in log archive and
  security tooling. Tests: Config rules
  s3-bucket-default-lock-enabled, s3-bucket-versioning-enabled,
  cloud- trail-log-file-validation-enabled,
  cloud-trail-encryption-enabled, cloudwatch-log-group-encrypted,
  s3-bucket-server-side-encryption- enabled,
  s3-default-encryption-kms, s3-bucket-ssl-requests-only,
  s3-bucket-public-read-prohibited,
  s3-bucket-public-write-prohibited,
  s3-account-level-public-access-blocks-periodic, s3-bucket-policy-
  grantee-check. Config does not test the SCP or who holds the
  logging admin role; those are manual evidence (SCP export,
  permission set assignment review).
