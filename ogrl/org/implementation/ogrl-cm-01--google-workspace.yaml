narrative: >
  Workspace settings managed in Terraform follow the same pull
  request path as AWS. Settings changed in the Admin console are
  tracked by the Admin audit log, which records who changed which
  setting and when. Console changes outside Terraform require a
  ticket reference in the runbook. Test: manual review of an Admin
  audit log sample against approved changes.
