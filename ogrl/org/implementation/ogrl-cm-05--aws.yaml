narrative: >
  Only the deployment pipeline role (GitHub OIDC) and a small named
  set of platform engineers can change production. Humans use IAM
  Identity Center permission sets with 1 hour sessions, read-only by
  default with elevation. SCPs block changes to logging, guardrails,
  and Config. Break-glass is an IAM user with FIDO keys, alerted on
  use. Tests: Config rules
  IAM_POLICY_NO_STATEMENTS_WITH_ADMIN_ACCESS and
  IAM_USER_NO_POLICIES_CHECK; manual quarterly review of permission
  set assignments and the apply role trust policy.
