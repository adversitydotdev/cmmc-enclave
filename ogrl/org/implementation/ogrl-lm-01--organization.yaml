narrative: >-
  {{ company_name }} owns the logging scope: the written list of
  auditable events (authentication, privilege changes, privileged
  function execution, configuration changes, CUI access), the 365
  day retention rule, and an audit event review at least annually
  and after significant changes or incidents, which updates the list
  (3.3.3). Evidence is the logged-events standard, the dated review
  record, and the resulting Terraform or runbook change. Policy
  templates come with issue #20. The logged-event standard also
  forbids CUI in log content (application logs and Session Manager
  transcripts), because CloudWatch Logs and SSM have no FIPS
  endpoint (3.13.11); the quarterly sample covers it.
