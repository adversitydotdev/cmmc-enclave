narrative: >-
  The company completes the CMMC assessment its DoD contracts
  require, enters the result in SPRS (level, status date, scope,
  CAGE codes, score, POA&M), closes any POA&M within 180 days of
  Conditional status, and the Affirming Official affirms in SPRS
  after each assessment and annually. No Rev 2 requirement maps to
  this control: it is a 32 CFR 170 program obligation, not an
  800-171 requirement. Test: manual evidence, SPRS record and
  affirmation dates. Policy template arrives with issue #20.
