narrative: >-
  {{ company_name }} requires encryption of CUI in transit and at
  rest: TLS 1.2 or higher with FIPS-approved cipher suites and
  AES-256 in a FIPS-validated module (3.13.8 a, 3.13.16). It does
  not rely on alternative physical safeguards (for example protected
  distribution systems) in place of cryptography, so the list of
  alternative safeguards for 3.13.8 b is empty. An exception needs a
  written approval naming the path and the safeguard. Session
  authenticity (3.13.15) comes from TLS with certificate validation.
  Evidence is the SSP statement and the exception log. Written into
  the System and Communications Protection Policy.
