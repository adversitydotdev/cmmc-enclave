narrative: >-
  Third-party app access is blocked unless approved
  (api_controls.unconfigured_third_party_apps), Marketplace and
  service access is limited per OU to FedRAMP High services, and
  external sharing is off or allowlisted for the CUI OU.
  Context-aware access can require managed devices. Tested by
  reading api_controls.* and drive_and_docs.external_sharing through
  the Policy API; per-OU service state is manual evidence.
