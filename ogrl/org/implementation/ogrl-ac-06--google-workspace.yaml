narrative: >-
  Temporary passwords: users are created with a one-time password
  and Change password at next sign-in is forced, and
  security-key-only enforcement means a password alone never grants
  access. Backup codes for lost keys are admin-generated with a
  bounded suspension grace period. Set in the user-creation runbook;
  tested by manual evidence (new-user creation screenshot, Reports
  API password change state) because the Policy API has no read for
  it.
