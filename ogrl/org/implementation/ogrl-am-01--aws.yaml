narrative: >
  Inventory of AWS components is generated, not hand-kept. AWS
  Config records every supported resource in every account and
  Region and aggregates to the security tooling account. AWS
  Organizations lists accounts. Terraform state lists the managed
  resources. A tag policy and an SCP require owner, environment, and
  data classification tags. Reconciliation: Terraform state against
  Config inventory quarterly. Test: Config rule
  EC2_INSTANCE_MANAGED_BY_SSM (compute is managed) plus a manual
  quarterly export of the Config aggregator inventory. AWS carries
  the platform; {{ company_name }} runs the reconciliation.
