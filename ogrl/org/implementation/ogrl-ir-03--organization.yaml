narrative: >-
  Every incident is recorded in one ticket queue with mandatory
  fields (source, timeline, severity, affected systems and data,
  actions, owner, resolution) and kept at least 3 years. Neither
  Workspace nor AWS offers a case-tracking tool for customer
  incidents (Workspace guide, IR.L2-3.6.2: customer). Test: manual
  evidence, ticket sample review.
