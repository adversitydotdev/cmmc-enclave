narrative: >-
  AWS Backup in the workload account with Backup Vault Lock
  (compliance mode), KMS CMK encryption, and cross-account copy to
  the log archive account so production credentials cannot delete
  recovery points. Not yet in the Terraform baseline, so planned.
  Tests: Config rules
  backup-plan-min-frequency-and-min-retention-check,
  rds-in-backup-plan, ebs-in-backup-plan, efs-in-backup-plan,
  dynamodb-in-backup-plan (CMMC 2.0 L2 conformance pack,
  MP.L2-3.8.9). AWS protects the facilities holding the backup
  storage; the customer configures vaults, keys, and retention.
