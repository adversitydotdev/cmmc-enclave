narrative: >-
  AWS Backup in the workload account with Backup Vault Lock, KMS CMK
  encryption, and a cross-account copy to a vault in the log archive
  account so production credentials cannot delete recovery points.
  The Terraform logging module defines the vaults, plan, and copy
  action. Vault Lock starts in governance mode. Compliance mode is
  set after validation through
  backup_vault_lock_changeable_for_days, which is irreversible. The
  log_archive copy vault uses its own backup CMK. Vaults and the
  plan exist in the home region only; the region allowlist is
  narrowed to match and Terraform refuses a wider one. Status stays
  planned until applied and verified. Tests: Config rules
  backup-plan-min-frequency-and-min-retention-check,
  rds-in-backup-plan, ebs-in-backup-plan, efs-in-backup-plan,
  dynamodb-in-backup-plan (CMMC 2.0 L2 conformance pack,
  MP.L2-3.8.9). AWS protects the facilities holding the backup
  storage; the customer configures vaults, keys, and retention.
