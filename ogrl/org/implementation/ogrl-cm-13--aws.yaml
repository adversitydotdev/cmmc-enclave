narrative: >-
  Nonlocal administration of AWS runs through IAM Identity Center
  with Google Workspace as the SAML IdP, so MFA (security keys) is
  enforced at the IdP, and permission sets expire after 1 hour. The
  break-glass path is an IAM user with FIDO keys. Sessions end at
  expiry, and CloudTrail logs every session. Tests: Config rule
  iam-user-mfa-enabled (CMMC 2.0 L2 pack, MA.L2-3.7.5); Identity
  Center permission set session duration read from Terraform state.
  AWS operates its own maintenance access under its FedRAMP
  boundary.
