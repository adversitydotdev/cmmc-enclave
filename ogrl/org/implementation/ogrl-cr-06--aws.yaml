narrative: >
  FIPS-validated cryptography is required where it protects CUI, so
  it is scoped to the CUI data path: S3, EBS, RDS and Backup data
  encrypted with our KMS keys (FIPS 140 validated HSMs), CUI in
  transit through the enclave's AWS endpoints, and ALB listeners on
  FIPS TLS policies. Identity and control-plane services (IAM, IAM
  Identity Center, identitystore, Organizations, the Backup API)
  carry no CUI, so 3.13.11 does not apply to them. AWS commercial
  regions use FIPS modules only when FIPS endpoints are called, and
  no IAM or SCP condition key shows which endpoint a request used,
  so FIPS is enforced client-side: every Terraform AWS provider sets
  use_fips_endpoint, with standard endpoints pinned only where no
  FIPS endpoint exists (Backup everywhere; sso-admin and
  identitystore in commercial). Standard-tier VPCs add sts-fips and
  kms-fips PrivateLink endpoints. S3 offers a FIPS PrivateLink
  interface endpoint (s3-fips); whether the S3 and DynamoDB gateway
  endpoints carry FIPS traffic is undocumented and is tested before
  relying on it (#46). ECR and Secrets Manager have no FIPS
  PrivateLink service but carry no CUI. CloudWatch Logs and SSM
  Session Manager also lack one and can carry CUI if applications
  log it or admins open sessions on CUI hosts; that is the remaining
  3.13.11 gap on AWS commercial, handled by keeping CUI out of logs
  and sessions or recording it (SCOPE section 9, item 15). GovCloud
  (ITAR tier) endpoints are FIPS by default. Test: terraform plan
  assertion on provider config, a listener TLS policy check (custom
  Config rule or manual evidence; the conformance pack has no ALB
  TLS-policy rule), and the crypto inventory
  (docs/crypto-inventory.csv). Certificates, all FIPS 140-3 and
  Active on the CMVP site as of 2026-11-24: AWS Key Management
  Service HSM #4884 (Level 3, sunset 2029-11-17) for KMS keys that
  protect S3, EBS, RDS and Backup data; AWS-LC for FIPS endpoints
  and ALB TLS (AWS says "latest release of AWS-LC (dynamic)" and
  AWS-Libcrypto but names no release, so the inventory lists the
  active AWS-LC certificates, newest dynamic #5595; ALB announcement
  links #4631); AWS-LC (static) for S3 and DynamoDB server-side
  encryption (newest #5596); Nitro Card Security Engine SSMAE #5310
  for EBS. AWS does not map services to certificate numbers on its
  pages, so the service-to-certificate mapping for AWS-LC is
  unconfirmed; confirm through AWS Artifact or the AWS account team
  and re-check status at each SSP review. Historical certificates
  are not cited.
