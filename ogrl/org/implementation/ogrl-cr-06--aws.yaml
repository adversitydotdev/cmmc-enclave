narrative: >
  AWS commercial regions use FIPS-validated modules only when FIPS
  endpoints are called, so our Terraform sets use_fips_endpoint in
  every AWS provider block and the SCP denies non-FIPS endpoints
  where condition keys allow. ALB listeners use FIPS TLS policies
  and KMS uses FIPS 140 validated HSMs. GovCloud (ITAR tier) uses
  FIPS endpoints by default. Test: terraform plan assertion on
  provider config plus the ALB policy Config rule a listener TLS
  policy check (the conformance pack has no ALB TLS-policy rule, so
  this is a custom rule or manual evidence), and manual CMVP
  certificate numbers in the crypto inventory. Google lists this
  native, AWS commercial is shared (SCOPE section 9, item 4).
