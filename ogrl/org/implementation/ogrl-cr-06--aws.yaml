narrative: >
  AWS commercial regions use FIPS-validated modules only when FIPS
  endpoints are called. No IAM or SCP condition key shows which
  endpoint a request used, so no SCP can deny non-FIPS endpoints;
  FIPS is enforced client-side. Our Terraform sets use_fips_endpoint
  in every AWS provider block. Services with no FIPS endpoint are
  pinned to standard endpoints: backup everywhere, and sso-admin and
  identitystore in commercial. Standard-tier VPCs add sts-fips and
  kms-fips PrivateLink endpoints. ssm, logs, ecr and secretsmanager
  have no FIPS PrivateLink service, so clients in the no-egress
  workload VPC reach them on standard endpoints. That is a
  documented 3.13.11 gap on AWS commercial. ALB listeners use FIPS
  TLS policies and KMS uses FIPS 140 validated HSMs. GovCloud (ITAR
  tier) endpoints are FIPS by default, with backup the only pinned
  exception. Test: terraform plan assertion on provider config plus
  a listener TLS policy check (custom Config rule or manual
  evidence; the conformance pack has no ALB TLS-policy rule), and
  manual CMVP certificate numbers in the crypto inventory. Google
  lists this native, AWS commercial is shared (SCOPE section 9, item
  4).
