narrative: >-
  Identity Center users are SCIM-synced from Workspace and groups
  are Terraform aws_identitystore_group resources, so each session
  maps to one named user. Sessions are 1 hour. Break-glass is the
  only inventoried non-SSO account. The org CloudTrail records the
  Identity Center user on each API call to an Object Lock bucket,
  covering user attribution for 3.3.2. Tested by Config rules
  cloudtrail-enabled, multi-region-cloudtrail-enabled, and
  cloud-trail-cloud-watch-logs-enabled. Processes and service
  identities use IAM roles, not users.
