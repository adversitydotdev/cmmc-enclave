narrative: >-
  {{ company_name }} maintains the inventory of CUI cryptographic
  uses with module and CMVP certificate number, reviewed annually
  against the CMVP list (docs/crypto-inventory.csv: AWS KMS HSM
  #4884, AWS-LC #5595 and others, Nitro SSMAE #5310, Google
  BoringCrypto #4735; all FIPS 140-3, Active as of 2026-11-24,
  re-checked at each SSP review; Historical certificates are not
  cited). A policy template follows in #20. It also owns the rule
  that CUI stays out of application logs and SSM Session Manager
  sessions on CUI hosts, which have no FIPS endpoint in commercial
  regions, checked by a quarterly sample of log content (3.13.11,
  3.3.1). Evidence is the inventory with certificate numbers and the
  quarterly sample record.
