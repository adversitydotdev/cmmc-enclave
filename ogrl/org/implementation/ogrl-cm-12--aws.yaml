narrative: >-
  AWS inspects diagnostic and test media for malicious code before
  use in the systems that run the cloud service, as part of the
  FedRAMP-authorized boundary. The enclave workload uses no
  customer-supplied diagnostic media. Test: manual evidence, annual
  review of the AWS FedRAMP authorization listing (Moderate for US
  East/West, High for GovCloud) and the public AWS data center
  controls page; no Artifact or CRM material is used.
