narrative: >
  AWS KMS generates and stores keys in FIPS 140 validated HSMs. Our
  Terraform creates customer managed keys per data class with
  automatic annual rotation, a 30 day deletion window, key policies
  that separate key administrators from key users, and CloudTrail
  logging of every KMS call to the log archive. Tested by Config
  rules cmk-backing-key-rotation-enabled,
  kms-cmk-not-scheduled-for-deletion,
  iam-customer-policy-blocked-kms-actions,
  iam-inline-policy-blocked-kms-actions.
