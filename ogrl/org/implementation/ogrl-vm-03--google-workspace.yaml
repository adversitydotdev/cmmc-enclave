narrative: >
  Google scans all Gmail messages and attachments for malware
  whether or not any attachment setting is on, and keeps its
  protection mechanisms current (3.14.2, 3.14.4, 3.14.5 are native
  per the Google guide, pages 112 to 114). The runbook adds extra
  protections for the CUI OU: enhanced pre-delivery message
  scanning, Security Sandbox rules for attachments and archives, and
  the Advanced Security Settings for senders with no history or low
  reputation. Tested by manual evidence of those Admin console
  settings, dated each quarter; a Cloud Identity Policy API read of
  the Gmail safety settings is used where it exposes them (not
  verified). Google carries the scanning; real-time scanning of
  files on the device is the Endpoints component. Edition
  requirements for Security Sandbox are not verified from a public
  source.
