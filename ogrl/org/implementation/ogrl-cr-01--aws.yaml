  - source: AWS FIPS 140-3 compliance
    url: "https://aws.amazon.com/compliance/fips/"
narrative: >
  AWS provides the FIPS-validated TLS and storage modules. Our
  Terraform enforces: HTTPS-only ALB listeners with the FIPS TLS
  1.2/1.3 policy ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04 and HTTP
  redirect (3.13.8, 3.13.15, 3.1.13), TLS-only S3 bucket policies,
  FIPS API endpoints set client-side (use_fips_endpoint; services
  without one are pinned to standard endpoints, see 3.13.11), and
  customer managed KMS keys on S3, EBS (encryption by default), RDS,
  EFS, SNS, CloudWatch Logs, and CloudTrail (3.13.16). The keys and
  EBS default encryption exist in the home region only, so the
  region allowlist SCP and allowed_regions default to the home
  region, and Terraform refuses a wider allowlist. Tested by Config
  rules alb-http-to-https-redirection-check,
  elb-tls-https-listeners-only, a listener TLS policy check (custom
  Config rule or manual evidence; the conformance pack has no ALB
  TLS-policy rule), s3-bucket-ssl-requests-only,
  acm-certificate-expiration-check, ec2-ebs-encryption-by-default,
  encrypted-volumes, rds-storage-encrypted,
  s3-default-encryption-kms, cloud-trail-encryption-enabled,
  cloudwatch-log-group-encrypted.
