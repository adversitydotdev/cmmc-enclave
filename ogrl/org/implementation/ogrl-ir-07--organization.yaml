narrative: >-
  {{ company_name }} holds a DoD-approved medium assurance
  certificate for the security lead and an alternate, checked
  quarterly. On a cyber incident the team reviews affected systems,
  reports at dibnet.dod.mil within 72 hours of discovery, submits
  malware to DC3, preserves images and logs for 90 days, and gives
  DoD access for forensics. The 72 hour clock is the DFARS
  252.204-7012 requirement, not a vendor feature. Test: manual
  evidence, certificate check records and tabletop drill of the
  report.
