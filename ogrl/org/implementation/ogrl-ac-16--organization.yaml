narrative: >-
  {{ company_name }} records which privacy and security notice
  applies to each CUI category and contract, has counsel approve one
  banner text, and reviews it annually. Neither Workspace sign-in
  nor AWS Identity Center shows a customer system use notice before
  access, so the notice is shown on managed endpoints at login and
  the gap is tracked for a POA&M until a tested path exists. Policy
  template comes with #20.
