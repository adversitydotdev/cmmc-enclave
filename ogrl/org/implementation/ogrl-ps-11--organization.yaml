narrative: >-
  Media leaves controlled areas only with authorized couriers or
  tracked carriers in sealed, tamper-evident packaging, with
  FIPS-validated encryption for digital media (3.8.6). Each
  transport is logged and open entries reconciled monthly. Test:
  manual evidence, transport log sample. No alternative physical
  safeguards replace encryption for digital media in transport; any
  exception needs a written approval (3.8.6).
