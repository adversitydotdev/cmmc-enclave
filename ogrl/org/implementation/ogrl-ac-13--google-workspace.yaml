narrative: >-
  Workspace is the central identity provider: each person has one
  unique user in the directory, authenticates once via 2-Step
  Verification, and reaches AWS through the Identity Center SAML app
  (manual runbook step). No shared user accounts; users are managed
  by Terraform (macadmins/googleworkspace) and SCIM users-only sync.
  Google is the IdP, so there is no SSO profile assignment to read.
  Tested by manual evidence of the SAML app existence and OU
  assignment, Reports API SAML login events, and the Directory API
  user list. Workspace audit logs (login events) land in the AWS log
  archive so actions trace to one user.
