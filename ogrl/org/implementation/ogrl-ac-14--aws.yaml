narrative: >
  Break-glass IAM user only: Terraform
  aws_iam_account_password_policy sets minimum length 14, upper,
  lower, number, and symbol classes, reuse prevention 24, and expiry
  90 days, covering 3.5.7 and 3.5.8 for that account; temporary
  passwords force reset at first sign-in (3.5.9); console sign-in is
  TLS and AWS stores credentials (3.5.10). IAM has no account
  lockout, so 3.1.8 for the break-glass user relies on FIDO key MFA,
  the use alert, and a compensating control: CloudWatch metric
  filters and alarms on failed ConsoleLogin events for the
  break-glass user and for root, notifying the security findings
  topic within minutes. This detects guessing; it does not lock the
  account. The change-of-4-characters rule is not an IAM option.
  Tested by Config rule iam-password-policy; the alarms are tested
  by a periodic failed-login drill whose ticket is the evidence.
  Accepted exception (2026-11-24, recorded in #42): IAM has no
  account lockout (3.1.8). It affects only the break-glass IAM user;
  all other access is through Workspace SSO with security keys.
  Compensating controls: failed ConsoleLogin alarms for break-glass
  and root, FIDO MFA required for any action, and no access keys.
