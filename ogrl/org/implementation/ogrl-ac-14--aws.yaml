narrative: >-
  Break-glass IAM user only: Terraform
  aws_iam_account_password_policy sets minimum length 14, upper,
  lower, number, and symbol classes, reuse prevention 24, and expiry
  90 days, covering 3.5.7 and 3.5.8 for that account; temporary
  passwords force reset at first sign-in (3.5.9); console sign-in is
  TLS and AWS stores credentials (3.5.10). IAM has no account
  lockout, so 3.1.8 for the break-glass user relies on FIDO key MFA
  and the use alert. The change-of-4-characters rule is not an IAM
  option. Tested by Config rule iam-password-policy.
